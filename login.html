<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classroom System — Login</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --accent:#4f46e5; --err:#ef4444; }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background: var(--card); border-radius:16px; padding:36px; width:100%; max-width:400px; }
  h1 { font-size:1.4rem; margin-bottom:6px; text-align:center; }
  .sub { color: var(--muted); font-size:0.85rem; text-align:center; margin-bottom:24px; }
  .tabs { display:flex; gap:8px; margin-bottom:20px; background:#0f172a; border-radius:10px; padding:4px; }
  .tabs button { flex:1; padding:8px; border:none; background:transparent; color:var(--muted); border-radius:8px; cursor:pointer; font-size:0.9rem; }
  .tabs button.active { background: var(--accent); color:#fff; }
  label { display:block; font-size:0.8rem; color:var(--muted); margin:12px 0 4px; }
  input, select { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--text); font-size:0.9rem; }
  button.submit { width:100%; margin-top:20px; padding:12px; background: var(--accent); color:#fff; border:none; border-radius:8px; font-size:1rem; cursor:pointer; }
  button.submit:disabled { opacity:0.6; cursor:not-allowed; }
  .msg { margin-top:14px; font-size:0.85rem; text-align:center; }
  .msg.error { color: var(--err); }
  .msg.ok { color:#22c55e; }
  .hidden { display:none; }
</style>
</head>
<body>

<div class="card">
  <h1>🏫 Classroom System</h1>
  <div class="sub">Sign in to continue</div>

  <div class="tabs">
    <button id="tabLogin" class="active" onclick="switchTab('login')">Log In</button>
    <button id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
  </div>

  <form id="loginForm">
    <label>Email</label>
    <input type="email" id="loginEmail" required />
    <label>Password</label>
    <input type="password" id="loginPassword" required />
    <button type="submit" class="submit">Log In</button>
  </form>

  <form id="signupForm" class="hidden">
    <label>Full Name</label>
    <input type="text" id="suName" required />
    <label>Email</label>
    <input type="email" id="suEmail" required />
    <label>Password</label>
    <input type="password" id="suPassword" required minlength="6" />
    <label>Role</label>
    <select id="suRole" onchange="toggleFacultyFields()">
      <option value="faculty">Faculty</option>
      <option value="admin">Admin</option>
    </select>
    <div id="facultyFields">
      <label>Department / Subject</label>
      <input type="text" id="suDept" placeholder="e.g. Computer Science" />
    </div>
    <label>Phone (optional)</label>
    <input type="tel" id="suPhone" placeholder="e.g. 9876543210" />
    <button type="submit" class="submit">Sign Up</button>
  </form>

  <div id="msg" class="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://wsjlhuaydtjldbglxghe.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzamxodWF5ZHRqbGRiZ2x4Z2hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5ODgzMjYsImV4cCI6MjEwMjU2NDMyNn0.-73CCcThBXRpKeC-c8Qohcriajethf2FgbfONraNnfg";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Where to send each role after login — update these once your pages are hosted
  const REDIRECT = {
    admin: "admin-portal.html",
    faculty: "dashboard.html"
  };

  function switchTab(tab) {
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
    document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
    document.getElementById('signupForm').classList.toggle('hidden', tab !== 'signup');
    setMsg('');
  }

  function toggleFacultyFields() {
    const isFaculty = document.getElementById('suRole').value === 'faculty';
    document.getElementById('facultyFields').style.display = isFaculty ? 'block' : 'none';
  }

  function setMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg' + (type ? ' ' + type : '');
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    setMsg('Logging in...');
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) { setMsg(error.message, 'error'); return; }

    const { data: profile, error: profErr } = await supabaseClient
      .from('profiles').select('role').eq('id', data.user.id).single();

    if (profErr || !profile) { setMsg('Login succeeded but profile not found.', 'error'); return; }

    setMsg('Welcome back! Redirecting...', 'ok');
    setTimeout(() => { window.location.href = REDIRECT[profile.role] || 'dashboard.html'; }, 800);
  });

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    setMsg('Creating account...');

    const full_name = document.getElementById('suName').value;
    const email = document.getElementById('suEmail').value;
    const password = document.getElementById('suPassword').value;
    const role = document.getElementById('suRole').value;
    const department_subject = document.getElementById('suDept').value || null;
    const phone = document.getElementById('suPhone').value || null;

    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if (error) { setMsg(error.message, 'error'); return; }

    if (!data.user) { setMsg('Check your email to confirm, then log in.', 'ok'); return; }

    const { error: insertErr } = await supabaseClient.from('profiles').insert({
      id: data.user.id, full_name, email, role, department_subject, phone
    });
    if (insertErr) { setMsg('Account created but profile save failed: ' + insertErr.message, 'error'); return; }

    setMsg('Account created! Redirecting...', 'ok');
    setTimeout(() => { window.location.href = REDIRECT[role] || 'dashboard.html'; }, 800);
  });

  toggleFacultyFields();
</script>

</body>
</html>
